<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Transfer Money - MyBank</title>
  <link rel="stylesheet" href="../css/transfer.css" />
</head>
<body>
  <div class="transfer-container">
    <header>
      <h1>💸 Transfer Money</h1>
      <button class="back-btn" onclick="window.location.href='dashboard.html'">⬅ Back to Dashboard</button>
    </header>

    <div class="transfer-card">
      <form id="transferForm">
        <div class="form-group">
          <label for="fromAccount">From Account</label>
          <select id="fromAccount" required>
            <option value="">Select Account</option>
          </select>
        </div>

        <div class="form-group">
          <label for="toAccount">Recipient Account Number</label>
          <input type="text" id="toAccount" placeholder="Enter recipient account number" required />
        </div>

        <div class="form-group">
          <label for="amount">Amount ($)</label>
          <input type="number" id="amount" placeholder="Enter amount" required min="1" step="0.01" />
        </div>

        <div class="form-group">
          <label for="description">Description (optional)</label>
          <input type="text" id="description" placeholder="e.g. Rent payment, Gift..." />
        </div>

        <button type="submit" class="transfer-btn">Transfer Now</button>
      </form>
    </div>

    <div class="confirmation-message hidden" id="confirmationMessage">
      ✅ Transfer Successful!  
      <p>Transaction ID: <span id="txnId">Loading...</span></p>
      <button class="back-btn" onclick="window.location.href='dashboard.html'">Go Back</button>
    </div>
  </div>

  <script src="../js/transfer.js"></script>
</body>
</html>
