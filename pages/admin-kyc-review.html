<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>KYC Review — SmartBank Admin</title>

  <link rel="stylesheet" href="../css/admin-dashboard.css" />
  <link rel="stylesheet" href="../css/admin-kyc-review.css" />
</head>
<body>

<div class="dashboard">

  <aside class="sidebar">
    <div class="sidebar-top">
      <h2 class="logo">smart<span>Bank</span></h2>
      <ul class="menu">
        <li class="menu-item" onclick="location.href='admin-dashboard.html'">
          ← Back to Dashboard
        </li>
      </ul>
    </div>
  </aside>

  <main class="main-content">

    <header class="header">
      <div>
        <h1>KYC Review</h1>
        <p class="subtext">Review customer identity details and documents</p>
      </div>
    </header>

    <section class="panel">
      <h3>Customer Information</h3>

      <div class="details-grid">
        <div><strong>Name:</strong> <span id="custName">-</span></div>
        <div><strong>Email:</strong> <span id="custEmail">-</span></div>
        <div><strong>Phone:</strong> <span id="custPhone">-</span></div>
        <div><strong>Date of Birth:</strong> <span id="custDob">-</span></div>
        <div><strong>Address:</strong> <span id="custAddress">-</span></div>
        <div><strong>KYC Status:</strong> <span id="custKycStatus">-</span></div>
        <div><strong>Account Status:</strong> <span id="custAccountStatus">-</span></div>
      </div>
    </section>

    <section class="panel">
      <h3>KYC Documents</h3>

      <div class="kyc-docs">
        <div class="doc-box">
          <strong>Aadhaar Front</strong>
          <img id="aadhaarFrontImg" alt="Aadhaar Front" />
        </div>

        <div class="doc-box">
          <strong>Aadhaar Back</strong>
          <img id="aadhaarBackImg" alt="Aadhaar Back" />
        </div>

        <div class="doc-box">
          <strong>PAN Card</strong>
          <img id="panImg" alt="PAN Card" />
        </div>
      </div>
    </section>

    <section class="panel" id="decisionBox">
      <h3>Admin Decision</h3>

      <textarea
        id="rejectReason"
        rows="4"
        placeholder="Rejection reason (required if rejecting)"
      ></textarea>

      <div class="action-row">
        <button class="action-btn" id="approveBtn">Approve KYC</button>
        <button class="action-btn danger" id="rejectBtn">Reject KYC</button>
      </div>
    </section>

  </main>
</div>

<script type="module" src="/js/admin/kyc-review.js"></script>
</body>
</html>
