<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Activate SmartBank Account</title>
    <link rel="stylesheet" href="../css/active-account.css">
</head>
<body>

<div class="container">
    <h2 class="title">Activate Your SmartBank Account</h2>
    <p class="subtitle">Set your username and password to complete activation.</p>

    <form id="activationForm" class="form-card">

        <input type="text" id="username" placeholder="Choose a username" required>
        <input type="password" id="password" placeholder="Create password" required>

        <button type="submit" class="btn">Activate Account</button>

        <p id="message"></p>
    </form>
</div>

<script src="../js/active-account.js"></script>
</body>
</html>
